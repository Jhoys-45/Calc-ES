<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Científica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap');

        body {
            font-family: 'Roboto', sans-serif;
            background-color: #0d0e10;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        /* LCD Screen matching exact image styling */
        .lcd-screen {
            background-color: #d8e3e2;
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.25);
            font-family: 'Roboto Mono', monospace;
            border-radius: 12px 12px 10px 10px;
        }

        /* Color definitions matching image */
        .color-shift { color: #f2ad1b; }
        .bg-shift { background-color: #f2ad1b; color: #111; }
        .color-alpha { color: #8a73dd; }
        .bg-alpha { background-color: #8a73dd; color: #fff; }
        .bg-orange-del { background-color: #e27530; color: #111; }
        .bg-orange-ac { background-color: #f58f4a; color: #111; }
        .bg-key { background-color: #2b2e36; color: #e1e3e6; }
        .bg-key:active { background-color: #3f434d; }
        .bg-key-num { background-color: #202227; color: #ffffff; }
        .bg-key-num:active { background-color: #353840; }

        /* Key Grid Styles */
        .calc-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-weight: 500;
            position: relative;
            box-shadow: 0 3px 0 rgba(0,0,0,0.4);
            transition: transform 0.05s ease, box-shadow 0.05s ease;
        }

        .calc-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 rgba(0,0,0,0.4);
        }

        /* D-Pad Layout */
        .dpad-container {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #383c46;
            border-radius: 12px;
            clip-path: polygon(15% 0%, 85% 0%, 100% 15%, 100% 85%, 85% 100%, 15% 100%, 0% 85%, 0% 15%);
        }

        .dpad-btn {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a0a5b1;
            font-size: 10px;
        }
        .dpad-btn:active { color: #ffffff; }
        .dpad-up { top: 4px; left: 0; right: 0; }
        .dpad-down { bottom: 4px; left: 0; right: 0; }
        .dpad-left { left: 4px; top: 0; bottom: 0; }
        .dpad-right { right: 4px; top: 0; bottom: 0; }
        .dpad-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 14px;
            height: 14px;
            background-color: #1a1c20;
            border-radius: 50%;
        }

        .sub-label-container {
            display: flex;
            justify-content: space-between;
            width: 100%;
            padding: 0 2px;
            font-size: 9px;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 2px;
            height: 11px;
        }

        .calc-body {
            max-width: 412px;
            width: 100%;
            background-color: #121418;
            border-radius: 20px;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen text-white p-2">

    <div class="calc-body shadow-2xl p-4 my-auto border border-gray-800">
        
        <!-- Top Status Bar Indicators -->
        <div class="flex justify-between items-center text-[9px] text-gray-500 font-mono px-1 mb-1 tracking-wider">
            <span class="text-[8px] text-gray-600">S A STO RCL</span>
            <div class="space-x-2">
                <span class="font-bold text-gray-300">NORM-11</span>
                <span>MATH</span>
                <span>DECI</span>
            </div>
        </div>

        <!-- LCD Screen (Matching Image 2 Display exactly) -->
        <div class="lcd-screen p-3 h-36 flex flex-col justify-between text-gray-800 mb-3 relative">
            <!-- Upper Left: Input Expression (e.g. 59x3) -->
            <div id="expression-display" class="text-left text-lg font-mono font-medium text-gray-900 overflow-x-auto whitespace-nowrap min-h-[28px] tracking-wide">
                <!-- Expression appears here -->
            </div>

            <!-- Lower Row: 3-dot option icon on the left, Result on the right -->
            <div class="flex items-end justify-between w-full mt-auto">
                <!-- Left Option Dots (⋮) -->
                <div class="text-gray-600 text-lg leading-none cursor-pointer hover:text-gray-900 pb-0.5">
                    <i class="fa-solid fa-ellipsis-vertical"></i>
                </div>

                <!-- Lower Right: Calculated Result (e.g. 177) -->
                <div id="result-display" class="text-right text-2xl font-mono font-semibold text-gray-900 overflow-x-auto whitespace-nowrap tracking-wider pl-2 min-h-[32px]">
                    <!-- Output result appears here -->
                </div>
            </div>
        </div>

        <!-- Top Function Icon Bar -->
        <div class="grid grid-cols-8 gap-1 mb-2 items-center text-center">
            <button class="bg-[#212328] hover:bg-[#2e3138] p-1.5 rounded-lg text-gray-300 flex justify-center items-center h-8">
                <i class="fa-solid fa-bars text-xs"></i>
            </button>
            <button class="bg-[#7c5cdb] text-white p-1 rounded-lg font-bold text-xs flex justify-center items-center space-x-0.5 h-8 col-span-1">
                <i class="fa-solid fa-gem text-[9px]"></i>
                <span class="text-[9px]">PRO</span>
            </button>
            <button class="bg-[#212328] hover:bg-[#2e3138] p-1.5 rounded-lg text-gray-300 flex justify-center items-center h-8 text-xs font-bold">
                ∑
            </button>
            <button class="bg-[#212328] hover:bg-[#2e3138] p-1.5 rounded-lg text-gray-300 flex justify-center items-center h-8">
                <i class="fa-solid fa-gear text-xs"></i>
            </button>
            <button class="bg-[#212328] hover:bg-[#2e3138] p-1.5 rounded-lg text-gray-300 flex justify-center items-center h-8 text-xs">
                <span class="border border-gray-400 rounded-full w-3.5 h-3.5 flex items-center justify-center text-[9px]">±</span>
            </button>
            <button class="bg-[#212328] hover:bg-[#2e3138] p-1.5 rounded-lg text-gray-300 flex justify-center items-center h-8">
                <i class="fa-solid fa-camera text-xs"></i>
            </button>
            <button class="bg-[#382d54] text-[#a98fec] p-1 rounded-lg font-bold text-[9px] h-8 flex items-center justify-center">
                MORE
            </button>
            <button class="bg-[#212328] hover:bg-[#2e3138] p-1 rounded-lg text-gray-300 text-[9px] font-bold h-8 flex items-center justify-center">
                RAD
            </button>
        </div>

        <!-- Keypad Matrix -->
        <div class="space-y-1.5">

            <!-- Row 1: SHIFT, ALPHA, D-PAD, MODE, 2nd -->
            <div class="grid grid-cols-5 gap-1.5 h-10">
                <button class="calc-btn bg-shift font-bold text-xs">SHIFT</button>
                <button class="calc-btn bg-alpha font-bold text-xs">ALPHA</button>
                
                <!-- Cross / D-Pad Button -->
                <div class="dpad-container relative">
                    <div class="dpad-btn dpad-up"><i class="fa-solid fa-caret-up"></i></div>
                    <div class="dpad-btn dpad-left"><i class="fa-solid fa-caret-left"></i></div>
                    <div class="dpad-btn dpad-right"><i class="fa-solid fa-caret-right"></i></div>
                    <div class="dpad-btn dpad-down"><i class="fa-solid fa-caret-down"></i></div>
                    <div class="dpad-center"></div>
                </div>

                <button class="calc-btn bg-key text-xs">MODE</button>
                <button class="calc-btn bg-key text-xs font-serif italic">2nd</button>
            </div>

            <!-- Row 2 -->
            <div class="grid grid-cols-5 gap-1.5">
                <div>
                    <div class="sub-label-container"><span class="color-shift">SOLVE</span><span class="color-alpha">=</span></div>
                    <button class="calc-btn bg-key w-full h-8 text-xs">CALC</button>
                </div>
                <div>
                    <div class="sub-label-container"><span class="color-shift">d/dx</span><span class="color-alpha">;</span></div>
                    <button class="calc-btn bg-key w-full h-8 text-xs">∫dx</button>
                </div>
                <div class="col-start-4">
                    <div class="sub-label-container justify-center"><span class="color-shift">x!</span></div>
                    <button class="calc-btn bg-key w-full h-8 text-xs">x ⁻¹</button>
                </div>
                <div>
                    <div class="sub-label-container"><span class="color-shift">∑</span><span class="color-alpha">∏</span></div>
                    <button class="calc-btn bg-key w-full h-8 text-xs">Log<sub>x</sub>y</button>
                </div>
            </div>

            <!-- Row 3 -->
            <div class="grid grid-cols-5 gap-1.5">
                <div>
                    <div class="sub-label-container"><span class="color-shift">x/y</span><span class="color-alpha">+R</span></div>
                    <button class="calc-btn bg-key w-full h-8 text-xs"><sup>x</sup>/<sub>y</sub></button>
                </div>
                <div>
                    <div class="sub-label-container"><span class="color-shift">³√x</span><span class="color-alpha">mod</span></div>
                    <button class="calc-btn bg-key w-full h-8 text-xs">√x</button>
                </div>
                <div>
                    <div class="sub-label-container"><span class="color-shift">x³</span><span class="color-alpha">x̄</span></div>
                    <button class="calc-btn bg-key w-full h-8 text-xs">x²</button>
                </div>
                <div>
                    <div class="sub-label-container"><span class="color-shift"><sup>x</sup>√y</span></div>
                    <button class="calc-btn bg-key w-full h-8 text-xs">x<sup>y</sup></button>
                </div>
                <div>
                    <div class="sub-label-container"><span class="color-shift">10<sup>x</sup></span><span class="color-alpha">e<sup>x</sup></span><span class="color-alpha">t</span></div>
                    <button class="calc-btn bg-key w-full h-8 text-xs">Log</button>
                </div>
            </div>

            <!-- Row 4 -->
            <div class="grid grid-cols-5 gap-1.5">
                <div>
                    <div class="sub-label-container"><span class="color-shift">∠</span><span class="color-alpha">a</span></div>
                    <button class="calc-btn bg-key w-full h-8 text-xs">(-)</button>
                </div>
                <div>
                    <div class="sub-label-container"><span class="color-shift">FACT</span><span class="color-alpha">b</span></div>
                    <button class="calc-btn bg-key w-full h-8 text-xs">° ' "</button>
                </div>
                <div>
                    <div class="sub-label-container"><span class="color-shift">|x|</span><span class="color-alpha">c</span></div>
                    <button class="calc-btn bg-key w-full h-8 text-xs">hyp</button>
                </div>
                <div>
                    <div class="sub-label-container"><span class="color-shift">Sin⁻¹</span><span class="color-alpha">d</span></div>
                    <button class="calc-btn bg-key w-full h-8 text-xs">Sin</button>
                </div>
                <div>
                    <div class="sub-label-container"><span class="color-shift">Cos⁻¹</span><span class="color-alpha">e</span></div>
                    <button class="calc-btn bg-key w-full h-8 text-xs">Cos</button>
                </div>
            </div>

            <!-- Row 5 -->
            <div class="grid grid-cols-5 gap-1.5">
                <div>
                    <div class="sub-label-container"><span class="color-shift">STO</span><span class="color-shift">CLRv</span></div>
                    <button class="calc-btn bg-key w-full h-8 text-xs">RCL</button>
                </div>
                <div>
                    <div class="sub-label-container"><span class="color-shift"><i>i</i></span><span class="color-alpha">Cot</span></div>
                    <button class="calc-btn bg-key w-full h-8 text-xs">ENG</button>
                </div>
                <div>
                    <div class="sub-label-container"><span class="color-shift">%</span><span class="color-alpha">Cot⁻¹</span></div>
                    <button onclick="appendInput('(')" class="calc-btn bg-key w-full h-8 text-xs">(</button>
                </div>
                <div>
                    <div class="sub-label-container"><span class="color-shift">,</span><span class="color-alpha">x</span></div>
                    <button onclick="appendInput(')')" class="calc-btn bg-key w-full h-8 text-xs">)</button>
                </div>
                <div>
                    <div class="sub-label-container"><span class="color-shift"><sup>a b</sup>/<sub>c</sub> ⇔ <sup>d</sup>/<sub>e</sub></span><span class="color-alpha">y</span></div>
                    <button class="calc-btn bg-key w-full h-8 text-xs">S ⇔ D</button>
                </div>
            </div>

            <!-- Row 6: Numbers 7, 8, 9 & Clear/Delete Keys -->
            <div class="grid grid-cols-5 gap-1.5">
                <div>
                    <div class="sub-label-container"><span class="color-shift">CONST</span></div>
                    <button onclick="appendInput('7')" class="calc-btn bg-key-num w-full h-9 text-base font-bold">7</button>
                </div>
                <div>
                    <div class="sub-label-container"><span class="color-shift">CONV</span><span class="color-alpha">SI</span></div>
                    <button onclick="appendInput('8')" class="calc-btn bg-key-num w-full h-9 text-base font-bold">8</button>
                </div>
                <div>
                    <div class="sub-label-container"><span class="color-shift">Limit</span><span class="color-alpha">∞</span></div>
                    <button onclick="appendInput('9')" class="calc-btn bg-key-num w-full h-9 text-base font-bold">9</button>
                </div>
                <div class="col-span-1">
                    <div class="sub-label-container"></div>
                    <button onclick="backspace()" class="calc-btn bg-orange-del w-full h-9 text-lg"><i class="fa-solid fa-delete-left"></i></button>
                </div>
                <div class="col-span-1">
                    <div class="sub-label-container"><span class="color-shift">CLR</span><span class="color-shift">ALL</span></div>
                    <button onclick="clearAll()" class="calc-btn bg-orange-ac w-full h-9 text-base font-bold">AC</button>
                </div>
            </div>

            <!-- Row 7: Numbers 4, 5, 6 & Multiplication / Division -->
            <div class="grid grid-cols-5 gap-1.5">
                <div>
                    <div class="sub-label-container"><span class="color-shift">MATRIX</span><span class="color-alpha">:::</span></div>
                    <button onclick="appendInput('4')" class="calc-btn bg-key-num w-full h-9 text-base font-bold">4</button>
                </div>
                <div>
                    <div class="sub-label-container"><span class="color-shift">VECTOR</span></div>
                    <button onclick="appendInput('5')" class="calc-btn bg-key-num w-full h-9 text-base font-bold">5</button>
                </div>
                <div>
                    <div class="sub-label-container"><span class="color-shift">FUNC</span><span class="color-alpha">HELP</span></div>
                    <button onclick="appendInput('6')" class="calc-btn bg-key-num w-full h-9 text-base font-bold">6</button>
                </div>
                <div>
                    <div class="sub-label-container"><span class="color-shift">nPr</span><span class="color-alpha">GCD</span></div>
                    <button onclick="appendInput('×')" class="calc-btn bg-key w-full h-9 text-lg font-bold">×</button>
                </div>
                <div>
                    <div class="sub-label-container"><span class="color-shift">nCr</span><span class="color-alpha">LCM</span></div>
                    <button onclick="appendInput('÷')" class="calc-btn bg-key w-full h-9 text-lg font-bold">÷</button>
                </div>
            </div>

            <!-- Row 8: Numbers 1, 2, 3 & Addition / Subtraction -->
            <div class="grid grid-cols-5 gap-1.5">
                <div>
                    <div class="sub-label-container"><span class="color-shift">STAT</span></div>
                    <button onclick="appendInput('1')" class="calc-btn bg-key-num w-full h-9 text-base font-bold">1</button>
                </div>
                <div>
                    <div class="sub-label-container"><span class="color-shift">CMPLX</span></div>
                    <button onclick="appendInput('2')" class="calc-btn bg-key-num w-full h-9 text-base font-bold">2</button>
                </div>
                <div>
                    <div class="sub-label-container"><span class="color-shift">DISTR</span></div>
                    <button onclick="appendInput('3')" class="calc-btn bg-key-num w-full h-9 text-base font-bold">3</button>
                </div>
                <div>
                    <div class="sub-label-container"><span class="color-shift">Pol</span><span class="color-alpha">Ceil</span></div>
                    <button onclick="appendInput('+')" class="calc-btn bg-key w-full h-9 text-lg font-bold">+</button>
                </div>
                <div>
                    <div class="sub-label-container"><span class="color-shift">Rec</span><span class="color-alpha">Floor</span></div>
                    <button onclick="appendInput('-')" class="calc-btn bg-key w-full h-9 text-lg font-bold">-</button>
                </div>
            </div>

            <!-- Row 9: 0, Dot, Exp, Ans, Equals -->
            <div class="grid grid-cols-5 gap-1.5">
                <div>
                    <div class="sub-label-container"><span class="color-shift">COPY</span><span class="color-alpha">PASTE</span></div>
                    <button onclick="appendInput('0')" class="calc-btn bg-key-num w-full h-9 text-base font-bold">0</button>
                </div>
                <div>
                    <div class="sub-label-container"><span class="color-shift">Ran#</span><span class="color-alpha">RanInt</span></div>
                    <button onclick="appendInput('.')" class="calc-btn bg-key-num w-full h-9 text-base font-bold">.</button>
                </div>
                <div>
                    <div class="sub-label-container"><span class="color-shift">π</span><span class="color-alpha">e</span></div>
                    <button class="calc-btn bg-key w-full h-9 text-sm font-semibold">Exp</button>
                </div>
                <div>
                    <div class="sub-label-container"><span class="color-alpha">PreAns</span></div>
                    <button class="calc-btn bg-key w-full h-9 text-sm font-semibold">Ans</button>
                </div>
                <div>
                    <div class="sub-label-container"><span class="color-shift">History</span></div>
                    <button onclick="calculateResult()" class="calc-btn bg-key w-full h-9 text-lg font-bold">=</button>
                </div>
            </div>

        </div>
    </div>

    <script>
        let currentExpression = '';
        let lastResult = '';

        const expressionDisplay = document.getElementById('expression-display');
        const resultDisplay = document.getElementById('result-display');

        function updateScreen() {
            expressionDisplay.innerText = currentExpression;
            resultDisplay.innerText = lastResult;
        }

        function appendInput(val) {
            currentExpression += val;
            updateScreen();
        }

        function clearAll() {
            currentExpression = '';
            lastResult = '';
            updateScreen();
        }

        function backspace() {
            if (currentExpression.length > 0) {
                currentExpression = currentExpression.slice(0, -1);
                updateScreen();
            }
        }

        function calculateResult() {
            if (!currentExpression) return;
            
            try {
                // Convert visual operators (×, ÷) to JS evaluation operators (*, /)
                let sanitizeExpr = currentExpression
                    .replace(/×/g, '*')
                    .replace(/÷/g, '/');

                let evaluated = eval(sanitizeExpr);
                
                if (evaluated !== undefined) {
                    lastResult = String(evaluated);
                }
            } catch (error) {
                lastResult = 'Error';
            }
            
            updateScreen();
        }
    </script>
</body>
</html>
